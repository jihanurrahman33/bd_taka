name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (flutter ${{ matrix.flutter-version || 'stable' }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # The lowest Flutter release with Dart 3.0, the package's floor.
          - flutter-version: "3.10.0"
          # An empty version means the latest stable release.
          - flutter-version: ""
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test example
      - run: flutter analyze
      # The VM and dart2js have different integer semantics, so run both.
      - run: flutter test
      - run: flutter test --platform chrome

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter pub publish --dry-run
