version: 0.1.0
homepage: https://github.com/jihanurrahman33/bd_taka
repository: https://github.com/jihanurrahman33/bd_taka
issue_tracker: https://github.com/jihanurrahman33/bd_taka/issues
topics:
  - bangladesh
  - taka
  - money
  - currency

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ">=3.0.0 <7.0.0"
